<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; padding: 12px;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  textarea {
    width: 100%; height: 150px; resize: vertical; padding: 8px;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    border: 1px solid rgba(128,128,128,.4); border-radius: 6px;
    background: transparent; color: inherit; outline: none;
  }
  textarea:focus { border-color: #2563eb; }
  .row { display: flex; align-items: center; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  input[type=number] {
    width: 68px; padding: 3px 6px; border: 1px solid rgba(128,128,128,.4);
    border-radius: 4px; background: transparent; color: inherit;
  }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid transparent;
    cursor: pointer; font: inherit; font-weight: 500;
  }
  #start { background: #2563eb; color: #fff; }
  #start:hover { background: #1d4ed8; }
  #stop { background: rgba(128,128,128,.2); color: inherit; }
  #stop:hover { background: rgba(128,128,128,.32); }
  .hint { margin-top: 9px; font-size: 11px; color: #888; line-height: 1.5; }
  .status { margin-top: 8px; font-size: 12px; min-height: 17px; color: #dc2626; }
</style>
</head>
<body>
  <h1>char-by inputer</h1>

  <textarea id="text" placeholder="在此粘贴要输入的文本"></textarea>

  <div class="row">
    <label>速度
      <input type="number" id="delay" min="0" max="2000" step="5" value="20"> ms/字
    </label>
    <label><input type="checkbox" id="jitter" checked> 随机抖动</label>
  </div>

  <div class="btns">
    <button id="start">开始输入</button>
    <button id="stop">停止</button>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
